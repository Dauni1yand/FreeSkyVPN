[project]
name = "freeskyvpn-bot"
version = "0.1.0"
description = "Telegram-бот FreeSkyVPN — MVP-клиент поверх API головного сервера"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.13",
    # Any proxy at all, not just SOCKS: aiogram refuses to configure a
    # proxied session without it even for http://. Needed because Telegram
    # is blocked where the head is hosted — see telegram_proxy_url.
    "aiohttp-socks>=0.9",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["botapp*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
