{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block anon %}
<div style="display:grid;place-items:center;min-height:100vh;padding:20px">
  <form method="post" action="/admin/login" class="card" style="width:100%;max-width:340px">
    <h2 style="margin-bottom:18px">FreeSkyVPN</h2>
    {% for kind, message in messages %}
      <div class="flash {{ kind }}">{{ message }}</div>
    {% endfor %}
    <label for="username">Логин</label>
    <input id="username" name="username" autocomplete="username" autofocus required>
    <label for="password">Пароль</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" style="width:100%;margin-top:18px">Войти</button>
  </form>
</div>
{% endblock %}
