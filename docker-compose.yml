# The whole service on one host: database, head (API + admin panel), bot.
#
# The head needs an xray binary of its own — not to serve users, but to
# generate Reality keys and to run the tunnel it falls back to when its
# direct connection to a node is blocked. It is installed in the image.
services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-freeskyvpn}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-freeskyvpn}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-freeskyvpn}"]
      interval: 5s
      timeout: 5s
      retries: 10

  head:
    build:
      context: .
      dockerfile: head/Dockerfile
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-freeskyvpn}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-freeskyvpn}
      HEAD_SECRET_KEY: "${HEAD_SECRET_KEY:?generate one on the host, see DEPLOY.md step 1}"
      SECRETS_KEY: "${SECRETS_KEY:?generate one on the host, see DEPLOY.md step 1}"
      # Guards everything that acts on another user's behalf. Never given to
      # the app — a secret compiled into a downloadable file is public.
      ADMIN_API_TOKEN: "${ADMIN_API_TOKEN:?generate one on the host, see DEPLOY.md step 1}"
      ADMIN_COOKIE_SECURE: ${ADMIN_COOKIE_SECURE:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      # Telegram is blocked where this is meant to run; empty means direct.
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      HEAD_CLIENT_CERT_PATH: /etc/freeskyvpn/head_client_cert.pem
      HEAD_CLIENT_KEY_PATH: /etc/freeskyvpn/head_client_key.pem
      NODE_CERT_CACHE_DIR: /var/lib/freeskyvpn/node_certs
      XRAY_CLIENT_BINARY_PATH: /usr/local/bin/xray
      BOOTSTRAP_SCRIPT_PATH: /provisioning/bootstrap_node.sh
    volumes:
      # The head's mTLS identity: every node is provisioned to trust exactly
      # this certificate, so losing it means re-provisioning the fleet.
      - ./secrets:/etc/freeskyvpn
      - nodecerts:/var/lib/freeskyvpn/node_certs
    ports:
      # Bound to loopback: put a TLS-terminating reverse proxy in front.
      # The admin panel accepts a password, so exposing this port directly
      # would mean logins in cleartext.
      - "127.0.0.1:8000:8000"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    restart: always
    depends_on:
      - head
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}"
      # Without this the bot cannot reach Telegram from a Russian host and
      # long polling fails on its first call. Empty means direct.
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      HEAD_API_URL: http://head:8000
      HEAD_ADMIN_TOKEN: ${ADMIN_API_TOKEN}
      # The only chat allowed to approve an Xray update from Telegram.
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID:-}
      # Chats allowed online through the bot; it cannot show ads.
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}

  # The way out to Telegram, for a head sitting behind the block that makes
  # one necessary. Off unless asked for: put COMPOSE_PROFILES=egress in .env
  # (plus EGRESS_VLESS_URL and TELEGRAM_PROXY_URL=socks5://egress:1080) and
  # an ordinary `docker compose up -d` brings it along.
  #
  # Reuses the head image rather than pulling another one — xray is already
  # installed there for Reality key generation and the control-plane
  # fallback tunnel, and this needs nothing else.
  egress:
    build:
      context: .
      dockerfile: head/Dockerfile
    restart: always
    profiles: ["egress"]
    depends_on:
      - head
    command: ["python", "/provisioning/egress.py"]
    environment:
      # Where it asks for a config, and re-asks when a node stops carrying
      # traffic. This is what makes the tunnel survive one node being
      # blocked — see provisioning/egress.py.
      HEAD_API_URL: http://head:8000
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:-}
      # Not `:?` — compose interpolates every service whether its profile is
      # active or not, so a required variable here would stop the stack for
      # everyone who never asked for this container. The script reports a
      # missing value itself, where the person who enabled it will see it.
      #
      # Setting this pins the proxy to one server and turns switching off.
      # Worth it only for a server outside the fleet, so that an alert about
      # the fleet does not travel through it.
      EGRESS_VLESS_URL: ${EGRESS_VLESS_URL:-}
      EGRESS_SOCKS_PORT: ${EGRESS_SOCKS_PORT:-1080}
      EGRESS_PROBE_URL: ${EGRESS_PROBE_URL:-https://api.telegram.org}
      EGRESS_PROBE_SECONDS: ${EGRESS_PROBE_SECONDS:-60}
      EGRESS_PROBE_FAILURES: ${EGRESS_PROBE_FAILURES:-3}
    # No ports published on purpose. An open SOCKS proxy reachable from the
    # internet is found by scanners within hours and becomes somebody
    # else's relay; the compose network is all that needs to see it.

volumes:
  pgdata:
  nodecerts:
